[package]
name = "vpn-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
axum = "0.7"
clap = { version = "4.5.61", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.12.1"
libp2p = { version = "0.54", features = ["tokio", "kad", "relay", "dcutr", "noise", "yamux", "tcp", "quic", "dns", "identify", "autonat", "ping", "macros", "request-response", "cbor", "ed25519", "rsa"] }
libp2p-stream = "0.2.0-alpha"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tun-rs = { version = "2.8.13", features = ["async_tokio"] }
